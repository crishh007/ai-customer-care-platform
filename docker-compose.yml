version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: aicustomer-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - aicustomer-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aicustomer-backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - GROQ_API_KEY=${GROQ_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongodb
    networks:
      - aicustomer-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aicustomer-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - aicustomer-network

networks:
  aicustomer-network:
    driver: bridge

volumes:
  mongodb_data:
